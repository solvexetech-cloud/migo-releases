name: migo_business
description: "MIGO Business — Manage your deals, grow your business."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# Version
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.0.5

  # UI / UX
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  intl: ^0.19.0

  # Responsive
  responsive_framework: ^1.5.1

  # Utilities
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true